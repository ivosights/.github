# Validate PR title format: [TASK-ID] Description or [TASK-ID][TAG] Description
# Examples:
#   [SCM-001] Add user login page
#   [SCM-001][LOGIN] Add user login page
#   [SCM-001][BUG] Fix login validation
#   [SCM-001][Defect] Resolve session timeout

name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  pr-title:
    name: Check PR title format
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Primary: [TASK-ID] Description
          # Optional: [TASK-ID][TAG] Description (e.g. [LOGIN], [BUG], [Defect])
          # TASK-ID: alphanumeric + hyphen + digits (e.g. SCM-001, PROJ-123)
          # [TASK-ID] = letters/numbers, hyphen, digits. Optional [TAG]. Then space and description.
          if echo "$PR_TITLE" | grep -qE '^\[[A-Za-z0-9]+-[0-9]+\](\[[A-Za-z]+\])?[[:space:]]+.+'; then
            echo "✓ PR title is valid: $PR_TITLE"
            exit 0
          fi
          echo "::error::PR title must match format: [TASK-ID] Description or [TASK-ID][TAG] Description"
          echo ""
          echo "Examples:"
          echo "  [SCM-001] Add user login page"
          echo "  [SCM-001][LOGIN] Add user login page"
          echo "  [SCM-001][BUG] Fix login validation"
          echo "  [SCM-001][Defect] Resolve session timeout"
          echo ""
          echo "Got: $PR_TITLE"
          exit 1
